apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h "${DATABASE_HOST:-db}" -p "${DATABASE_PORT:-5432}" -U "${POSTGRES_USER:-grainlab_user}" -d "${POSTGRES_DB:-grainlab}"; do
                echo "Waiting for database ${DATABASE_HOST:-db}:${DATABASE_PORT:-5432} to become ready..."
                sleep 2
              done
              echo "Database is ready!"
          envFrom:
            - configMapRef:
                name: grainlab-config
            - secretRef:
                name: grainlab-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: web
          image: ghcr.io/your-username/grainlab:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(POSTGRES_DB)"
          envFrom:
            - configMapRef:
                name: grainlab-config
            - secretRef:
                name: grainlab-secret
          volumeMounts:
            - name: backup-data
              mountPath: /backups
          readinessProbe:
            httpGet:
              path: /login/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /login/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: backup-data
          persistentVolumeClaim:
            claimName: grainlab-backup-pvc
