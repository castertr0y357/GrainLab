apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
  labels:
    app.kubernetes.io/name: beat
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beat
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h "${DATABASE_HOST:-db}" -p "${DATABASE_PORT:-5432}" -U "${POSTGRES_USER:-grainlab_user}" -d "${POSTGRES_DB:-grainlab}"; do
                echo "Waiting for database ${DATABASE_HOST:-db}:${DATABASE_PORT:-5432} to become ready..."
                sleep 2
              done
              echo "Database is ready!"
          envFrom:
            - configMapRef:
                name: grainlab-config
            - secretRef:
                name: grainlab-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: beat
          image: ghcr.io/castertr0y357/grainlab:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - grainlab
            - beat
            - -l
            - info
          envFrom:
            - configMapRef:
                name: grainlab-config
            - secretRef:
                name: grainlab-secret
          volumeMounts:
            - name: backup-data
              mountPath: /backups
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: backup-data
          persistentVolumeClaim:
            claimName: grainlab-backup-pvc
