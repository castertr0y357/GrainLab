{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrainLab - Food Science Compiler</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
    
    <!-- Custom styling -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=1784663382">
    
    <!-- HTMX & Alpine.js CDNs -->
    <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>
    {% block head_scripts %}{% endblock %}
    <script src="https://unpkg.com/alpinejs@3.13.10" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <header>
        <div class="header-inner">
            <a href="{% url 'calculator_phase1' %}" class="logo">
                🌾 Grain<span>Lab</span>
            </a>
            <div class="nav-links">
                <a href="{% url 'calculator_phase1' %}" class="nav-btn">Compiler</a>
                <a href="{% url 'inventory_page' %}" class="nav-btn">Inventory</a>
                <a href="{% url 'settings_page' %}" class="nav-btn">AI Settings</a>
            </div>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer style="text-align: center; padding: 2rem 0; color: var(--text-muted); font-size: 0.9rem; border-top: 1px solid var(--border); margin-top: 3rem;">
        &copy; 2026 GrainLab compiler stack. Engineered for kitchen countertop mobile safety.
    </footer>
</body>
</html>
