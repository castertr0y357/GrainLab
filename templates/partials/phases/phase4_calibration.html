        <!-- PHASE 4: Yield & Refinement -->

<!-- Component 2: Semantic Appliance Filtering & Contextual Actions -->
        <div class="card" style="padding: 1.25rem; background-color: var(--bg-card); margin-bottom: 1.5rem;">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem;">
                <div>
                    <!-- Appliance selection deck -->
                    <h4 style="font-size: 1rem; margin-bottom: 0.75rem; color: var(--accent); font-weight: 600;">Hardware &amp; Appliance Selector</h4>
                    <input type="hidden" name="mixing_method" :value="mixing_method">
                    <div class="pill-btn-group">
                        <template x-for="tool in filteredTools" :key="tool.id">
                            <button type="button" 
                                    class="pill-btn" 
                                    :class="mixing_method === tool.id ? 'active' : ''"
                                    @click="mixing_method = tool.id; $nextTick(() => htmx.trigger('#calculator-form', 'change'));"
                                    @mouseenter="setHoveredElement(tool.id)"
                                    @mouseleave="clearHoveredElement()"
                                    @focusin="setHoveredElement(tool.id)"
                                    @focusout="clearHoveredElement()">
                                <span x-text="tool.name"></span>
                            </button>
                        </template>
                    </div>

                    <!-- Gluten prevention warning banner -->
                    <div x-show="activeProductionProfile.mechanical_energy_threshold === 'minimal_folding' && ['stand_mixer', 'bread_machine', 'food_processor'].includes(mixing_method)" 
                         style="background-color: rgba(255, 159, 28, 0.1); border-left: 4px solid var(--warning); padding: 0.75rem 1rem; border-radius: var(--radius-sm); margin-top: 1rem;">
                        <h4 style="color: var(--warning); margin: 0 0 0.25rem 0; font-weight: 700; font-size: 0.85rem; text-transform: uppercase;">⚠️ Shear Force Warning</h4>
                        <p style="font-size: 0.8rem; color: var(--text-primary); margin: 0; line-height: 1.4;">
                            Intensive mixing will over-develop gluten and destroy the tender structure required for <span x-text="engines_ff?.[selected_master]?.title"></span>. Use a spatula or fold gently.
                        </p>
                    </div>
                </div>

                <div>
                    <!-- Action Sequence Configurator -->
                    <h4 style="font-size: 1rem; margin-bottom: 0.75rem; color: var(--accent); font-weight: 600;">Primary Action Sequence</h4>
                    <input type="hidden" name="active_action" :value="active_action">
                    <div class="pill-btn-group">
                        <template x-for="action in (required_actions.length > 0 ? required_actions : activeProductionProfile.permissible_action_types)" :key="action">
                            <button type="button" 
                                    class="pill-btn" 
                                    :class="active_action === action ? 'active' : ''"
                                    @click="active_action = action; $nextTick(() => htmx.trigger('#calculator-form', 'change'));"
                                    @mouseenter="setHoveredElement(action)"
                                    @mouseleave="clearHoveredElement()"
                                    @focusin="setHoveredElement(action)"
                                    @focusout="clearHoveredElement()">
                                <span style="text-transform: capitalize;" x-text="action.replace('_', ' ')"></span>
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </div>
