{% if presets %}
    {% for preset in presets %}
        <a href="{% url 'load_preset' preset.id %}" class="search-item" style="text-decoration: none; color: inherit; display: block;">
            <strong>{{ preset.name }}</strong>
            <span style="font-size: 0.85rem; color: var(--text-muted); display: block;">
                {{ preset.dough_category.name }} • {{ preset.form_factor.name }}
            </span>
        </a>
    {% endfor %}
{% else %}
    <div class="search-item" style="cursor: default; color: var(--text-muted);">No bread targets found</div>
{% endif %}
