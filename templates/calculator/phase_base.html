{% extends 'base.html' %}

{% block content %}
<div {% block phase_x_data %}{% endblock %} class="calculator-layout" {% block phase_x_init %}{% endblock %}>
    {% block phase_hidden_forms %}{% endblock %}
    
    <div class="calculator-grid" style="display: grid; grid-template-columns: 1fr 350px; gap: 2rem;">
        
        <!-- Left Panel: Main Content -->
        <div class="panel-left card" style="padding: 1.5rem; background-color: var(--bg-card); border-color: var(--border);">
            {% block phase_left_panel %}{% endblock %}
        </div>
        
        <!-- Right Panel: Sidebar / Inspector -->
        <div class="panel-right card" style="position: sticky; top: 2rem; height: fit-content; padding: 1.5rem; background-color: var(--bg-card); border-color: var(--border);">
            {% block phase_right_panel %}{% endblock %}
        </div>
        
    </div>
</div>

<style>
@media (max-width: 900px) {
    .calculator-grid {
        grid-template-columns: 1fr !important;
    }
    .panel-right {
        position: static !important;
    }
}
</style>
{% endblock %}
