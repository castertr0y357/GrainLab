services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-grainlab}
      POSTGRES_USER: ${DB_USER:-grainlab_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - backups:/app/backups
    networks:
      - app_network

  redis:
    image: redis:alpine
    restart: always
    networks:
      - app_network

  web:
    build: .
    environment:
      - DATABASE_URL=postgres://${DB_USER:-grainlab_user}:${DB_PASSWORD}@db:${DB_PORT:-5432}/${DB_NAME:-grainlab}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - MOCK_MODE=${MOCK_MODE}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - backups:/app/backups
    networks:
      - app_network

  celery:
    build: .
    environment:
      - DATABASE_URL=postgres://${DB_USER:-grainlab_user}:${DB_PASSWORD}@db:${DB_PORT:-5432}/${DB_NAME:-grainlab}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - MOCK_MODE=${MOCK_MODE}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: celery -A grainlab worker -l info
    depends_on:
      - db
      - redis
    volumes:
      - backups:/app/backups
    networks:
      - app_network

  celery-beat:
    build: .
    environment:
      - DATABASE_URL=postgres://${DB_USER:-grainlab_user}:${DB_PASSWORD}@db:${DB_PORT:-5432}/${DB_NAME:-grainlab}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - MOCK_MODE=${MOCK_MODE}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: celery -A grainlab beat -l info
    depends_on:
      - db
      - redis
    volumes:
      - backups:/app/backups
    networks:
      - app_network

volumes:
  postgres_data:
  backups:

networks:
  app_network:
    driver: bridge
