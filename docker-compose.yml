services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-grainlab}
      POSTGRES_USER: ${DB_USER:-grainlab_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  web:
    build: .
    environment:
      - DATABASE_URL=postgres://${DB_USER:-grainlab_user}:${DB_PASSWORD}@db:${DB_PORT:-5432}/${DB_NAME:-grainlab}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - MOCK_MODE=${MOCK_MODE}
    depends_on:
      - db
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
